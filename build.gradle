plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.winefox.skyfarer'
version = '0.6.0'
base { archivesName = 'winefox_skyfarer-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.250'
    mods { winefox_skyfarer { sourceSet sourceSets.main } }
}
sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('verifyScanCadence', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'dev.winefox.skyfarer.ai.ScanCadenceChecks'
}
tasks.named('check') { dependsOn verifyScanCadence }
tasks.register('verifyFlightMath', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'dev.winefox.skyfarer.flight.FlightMathChecks'
}
tasks.named('check') { dependsOn verifyFlightMath }
tasks.register('verifyFlightPrediction', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'dev.winefox.skyfarer.flight.FlightPredictionChecks'
}
tasks.named('check') { dependsOn verifyFlightPrediction }
tasks.register('verifyAttackPolicy', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'dev.winefox.skyfarer.ai.AttackPolicyChecks'
}
tasks.register('verifySpearIntercept', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'dev.winefox.skyfarer.flight.SpearInterceptChecks'
}
tasks.named('check') { dependsOn verifyAttackPolicy, verifySpearIntercept }
tasks.register('verifyMaidCombat', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'dev.winefox.skyfarer.ai.MaidCombatChecks'
}
tasks.named('check') { dependsOn verifyMaidCombat }
tasks.register('verifyGlideCorridor', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'dev.winefox.skyfarer.flight.GlideCorridorChecks'
}
tasks.named('check') { dependsOn verifyGlideCorridor }
tasks.register('verifyTerrainCombat', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'dev.winefox.skyfarer.flight.TerrainCombatChecks'
}
tasks.named('check') { dependsOn verifyTerrainCombat }
tasks.register('verifySurfaceLaunch', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'dev.winefox.skyfarer.flight.SurfaceLaunchChecks'
}
tasks.register('verifyYsmCompatibility', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'dev.winefox.skyfarer.flight.YsmCompatibilityChecks'
}
tasks.named('check') { dependsOn verifySurfaceLaunch, verifyYsmCompatibility }
tasks.register('verifyCombatRecovery', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'dev.winefox.skyfarer.flight.CombatRecoveryChecks'
}
tasks.named('check') { dependsOn verifyCombatRecovery }
tasks.register('verifySorties', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'dev.winefox.skyfarer.flight.SortieChecks'
}
tasks.named('check') { dependsOn verifySorties }

// Compile the ACTUAL controller, selectors, settings and planners against offline external API fixtures.
// Fixtures never belong to the mod source set or the delivered Jar; no Minecraft process is launched.
def replayProduction = fileTree('src/main/java') {
    include 'dev/winefox/skyfarer/ai/*.java'
    include 'dev/winefox/skyfarer/flight/*.java'
    include 'dev/winefox/skyfarer/async/*.java'
    exclude 'dev/winefox/skyfarer/async/MaidTerrainSource.java'
    include 'dev/winefox/skyfarer/config/SkyfarerConfig.java', 'dev/winefox/skyfarer/config/SkyfarerSettings.java'
    include 'dev/winefox/skyfarer/runtime/DebugSnapshot.java'
    include 'dev/winefox/skyfarer/command/TransitFlight.java', 'dev/winefox/skyfarer/command/DispatchPolicy.java'
    include 'dev/winefox/skyfarer/command/CreativeTransitPlanner.java'
    exclude 'dev/winefox/skyfarer/flight/ElytraFlightController.java'
}
tasks.register('compileControllerReplay', JavaCompile) {
    source replayProduction, fileTree('src/replay/java') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/controllerReplay')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.register('verifyControllerReplay', JavaExec) {
    dependsOn compileControllerReplay
    classpath = files(layout.buildDirectory.dir('classes/controllerReplay'))
    mainClass = 'dev.winefox.skyfarer.replay.ControllerReplayChecks'
    systemProperty 'wfs.replayCase', System.getProperty('wfs.replayCase', '')
}
tasks.named('check') { dependsOn verifyControllerReplay }

tasks.register('verifyCommandDispatch', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'dev.winefox.skyfarer.command.CommandChecks'
}
tasks.register('verifyDispatchReplay', JavaExec) {
    dependsOn compileControllerReplay
    classpath = files(layout.buildDirectory.dir('classes/controllerReplay'))
    mainClass = 'dev.winefox.skyfarer.command.DispatchReplayChecks'
}
tasks.named('check') { dependsOn verifyCommandDispatch, verifyDispatchReplay }

tasks.register('verifyDebugTools', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'dev.winefox.skyfarer.runtime.DebugToolsChecks'
    // NBT-only checks use console logging, not the dependency Jar's game log file configuration.
    systemProperty 'log4j.configurationFile', file('tools/offline-log4j2.xml').toURI().toString()
}
tasks.named('check') { dependsOn verifyDebugTools }

tasks.register('verifyCombatEntries', JavaExec) {
    dependsOn compileControllerReplay
    classpath = files(layout.buildDirectory.dir('classes/controllerReplay'))
    mainClass = 'dev.winefox.skyfarer.replay.CombatEntryReplayChecks'
}
tasks.named('check') { dependsOn verifyCombatEntries }

tasks.register('verifySweepingAttacks', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'dev.winefox.skyfarer.flight.SweepingAttackChecks'
}
tasks.named('check') { dependsOn verifySweepingAttacks }
tasks.register('verifySweepingReplay', JavaExec) {
    dependsOn compileControllerReplay
    classpath = files(layout.buildDirectory.dir('classes/controllerReplay'))
    mainClass = 'dev.winefox.skyfarer.replay.SweepingAttackReplayChecks'
}
tasks.named('check') { dependsOn verifySweepingReplay }

tasks.register('verifyAsyncPlanning', JavaExec) {
    dependsOn compileControllerReplay
    classpath = files(layout.buildDirectory.dir('classes/controllerReplay'))
    mainClass = 'dev.winefox.skyfarer.async.AsyncPlannerChecks'
}
tasks.named('check') { dependsOn verifyAsyncPlanning }
tasks.register('verifyAsyncSweep', JavaExec) {
    dependsOn compileControllerReplay
    classpath = files(layout.buildDirectory.dir('classes/controllerReplay'))
    mainClass = 'dev.winefox.skyfarer.async.AsyncSweepChecks'
}
tasks.named('check') { dependsOn verifyAsyncSweep }
tasks.register('verifyPlannerLoad', JavaExec) {
    dependsOn compileControllerReplay
    classpath = files(layout.buildDirectory.dir('classes/controllerReplay'))
    mainClass = 'dev.winefox.skyfarer.async.PlannerLoadChecks'
}
tasks.named('check') { dependsOn verifyPlannerLoad }
dependencies {
    // Read-only API reference; neither bundled into this mod nor installed as a test client.
    compileOnly files('tools/ysm-reference.jar')
    implementation files('libs/touhoulittlemaid-1.5.3-neoforge+mc1.21.1.jar')
    implementation files('libs/spear-backport-neoforge-1.8.0-1.21.1.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') {
    manifest { attributes('Implementation-Version': project.version) }
}
