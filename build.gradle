plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.winefox.skyfarer'
version = '0.7.5'
base { archivesName = 'winefox_skyfarer-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.250'
    mods { winefox_skyfarer { sourceSet sourceSets.main } }
}
sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('verifyScanCadence', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'dev.winefox.skyfarer.ai.ScanCadenceChecks'
