    // Read-only API reference; neither bundled into this mod nor installed as a test client.
    compileOnly files('tools/ysm-reference.jar')
    implementation files('libs/touhoulittlemaid-1.5.3-neoforge+mc1.21.1.jar')
    implementation files('libs/spear-backport-neoforge-1.8.0-1.21.1.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') {
    manifest { attributes('Implementation-Version': project.version) }
}

